<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraShort Keep - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get, remove, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmmOJue97ewmU5XIoObY6Os22lrPKIcL8",
            authDomain: "torataro.firebaseapp.com",
            databaseURL: "https://torataro-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "torataro",
            storageBucket: "torataro.firebasestorage.app",
            messagingSenderId: "357999678278",
            appId: "1:357999678278:web:d7a4dcc62519fe45d88b47",
            measurementId: "G-92WXGNGBSN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- FUNGSI USER ---
        window.fbSaveData = async function(text, pass, days) {
            try {
                let finalContent = text;
                if(pass) finalContent = CryptoJS.AES.encrypt(text, pass).toString();

                const now = new Date();
                const expiryDate = new Date(now.getTime() + (days * 24 * 60 * 60 * 1000));

                let shortCode = generateShortId(5);
                let codeExists = true;
                
                while(codeExists) {
                    const snapshot = await get(ref(db, 'codes/' + shortCode));
                    if (snapshot.exists()) {
                        shortCode = generateShortId(6);
                    } else {
                        codeExists = false;
                    }
                }

                await set(ref(db, 'codes/' + shortCode), {
                    content: finalContent,
                    expiry: expiryDate.getTime(),
                    hasPass: !!pass
                });

                return { success: true, code: shortCode };
            } catch (error) {
                return { success: false, message: "Gagal menyimpan: " + error.message };
            }
        };

        window.fbLoadData = async function(code, pass) {
            try {
                const snapshot = await get(ref(db, 'codes/' + code));
                if (!snapshot.exists()) return { success: false, message: "Kode tidak ditemukan." };

                const data = snapshot.val();
                const now = new Date().getTime();

                if (now > data.expiry) {
                    await remove(ref(db, 'codes/' + code));
                    return { success: false, message: "Data SUDAH KEDALUWARSA." };
                }

                let finalText = "";
                if(data.hasPass) {
                    if(!pass) return { success: false, message: "Data ini diproteksi password." };
                    const bytes = CryptoJS.AES.decrypt(data.content, pass);
                    finalText = bytes.toString(CryptoJS.enc.Utf8);
                    if(!finalText) return { success: false, message: "Password SALAH!" };
                } else {
                    finalText = data.content;
                }
                return { success: true, text: finalText };
            } catch (error) {
                return { success: false, message: "Gagal mengambil data." };
            }
        };

        // --- FUNGSI ADMIN ---
        // 1. Hitung Jumlah Data
        window.fbGetStats = async function() {
            try {
                const snapshot = await get(ref(db, 'codes'));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    return Object.keys(data).length;
                }
                return 0;
            } catch (e) {
                console.error(e);
                return -1;
            }
        };

        // 2. Hapus Semua Data (Nuclear)
        window.fbNukeAll = async function() {
            try {
                // Hapus seluruh node 'codes'
                await remove(ref(db, 'codes'));
                return { success: true };
            } catch (error) {
                return { success: false, message: error.message };
            }
        };

    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        :root {
            --primary: #2563EB;
            --danger: #EF4444;
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --border: #E2E8F0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px;
        }

        .container {
            width: 100%; max-width: 500px; background: var(--card); padding: 2rem;
            border-radius: 16px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1);
        }

        h1 { text-align: center; margin-bottom: 0.5rem; color: var(--primary); cursor: pointer; user-select: none; transition: 0.2s; }
        h1:active { transform: scale(0.95); } /* Efek klik */
        .subtitle { text-align: center; color: #64748B; font-size: 0.9rem; margin-bottom: 1.5rem; }

        textarea {
            width: 100%; height: 120px; padding: 1rem; border: 2px solid var(--border);
            border-radius: 12px; font-family: inherit; resize: vertical; margin-bottom: 1rem;
        }
        input, select {
            width: 100%; padding: 1rem; border: 2px solid var(--border); border-radius: 12px; margin-bottom: 1rem;
        }
        input:focus, textarea:focus { border-color: var(--primary); }

        .btn {
            width: 100%; padding: 1rem; border: none; border-radius: 12px;
            background: var(--primary); color: white; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { background: #94A3B8; cursor: not-allowed; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #DC2626; }

        .result {
            display: none; margin-top: 1.5rem; padding: 1.5rem; background: #EFF6FF;
            border-radius: 12px; text-align: center; border: 2px dashed #BFDBFE; animation: fadeIn 0.3s;
        }
        .short-code {
            font-family: monospace; font-size: 2.5rem; font-weight: 800; color: var(--primary);
            letter-spacing: 4px; margin: 1rem 0; cursor: pointer; user-select: all; text-transform: uppercase;
        }

        .tabs { display: flex; margin-bottom: 1.5rem; background: #F1F5F9; padding: 4px; border-radius: 10px; }
        .tab {
            flex: 1; padding: 10px; text-align: center; cursor: pointer; border-radius: 8px;
            font-weight: 600; color: #64748B; transition: 0.2s;
        }
        .tab.active { background: white; color: var(--primary); }

        /* Admin Modal */
        #admin-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-card {
            background: white; padding: 2rem; border-radius: 16px; width: 90%; max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }
        .stat-box {
            background: #F1F5F9; padding: 1rem; border-radius: 8px; text-align: center; margin: 1rem 0;
        }
        .stat-number { font-size: 2rem; font-weight: 800; color: var(--primary); }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #1F2937; color: white; padding: 12px 24px; border-radius: 50px;
            opacity: 0; pointer-events: none; transition: 0.3s; z-index: 2000;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--danger); }
        
        .loading-spinner {
            display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <!-- Aftonwill -->
        <h1 id="appTitle" onclick="checkAdminClick()">UltraShort Keep</h1>
        <p class="subtitle">Aftonwill</p>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('save')">Simpan</div>
            <div class="tab" onclick="switchTab('open')">Buka</div>
        </div>

        <!-- TAB SIMPAN -->
        <div id="tab-save">
            <textarea id="inputText" placeholder="Tulis teks panjang di sini..."></textarea>
            <input type="password" id="passInput" placeholder="Password (Opsional)">
            
            <select id="expirySelect">
                <option value="1">Kedaluwarsa dalam 1 Hari</option>
                <option value="7" selected>Kedaluwarsa dalam 7 Hari</option>
                <option value="30">Kedaluwarsa dalam 30 Hari</option>
            </select>

            <button class="btn" id="saveBtn" onclick="handleSave()">Generate Kode (Upload)</button>
            
            <div id="saveResult" class="result">
                <p>Berhasil disimpan! Kode Anda:</p>
                <div class="short-code" onclick="copyCode()" id="displayCode">...</div>
                <p style="font-size: 0.85rem; color: #64748B;">Klik kode di atas untuk menyalin</p>
            </div>
        </div>

        <!-- TAB BUKA -->
        <div id="tab-open" style="display: none;">
            <input type="text" id="inputCode" placeholder="Masukkan Kode Pendek" style="text-align:center; text-transform:uppercase;">
            
            <div id="openPassGroup" style="display: none;">
                <input type="password" id="openPass" placeholder="Masukkan Password">
            </div>

            <button class="btn" id="openBtn" onclick="handleLoad()">Buka Data</button>

            <div id="openResult" class="result" style="text-align: left; background: #F0FDF4; border-color: #86EFAC;">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <strong style="color: #166534;">Berhasil Dibuka!</strong>
                    <button onclick="downloadOpenData()" style="background:none; border:none; color:var(--primary); cursor:pointer; font-weight:600;">Download</button>
                </div>
                <textarea id="outputText" readonly style="height: 150px; background: white; border-color: #BBF7D0;"></textarea>
            </div>
        </div>
    </div>

    <!-- MODAL ADMIN -->
    <div id="admin-modal">
        <div class="modal-card">
            <h2 style="margin-bottom:1rem; color:var(--primary);">Menu Admin</h2>
            
            <div id="admin-login-view">
                <p style="margin-bottom:1rem; font-size:0.9rem;">Masukkan kata kunci admin:</p>
                <input type="password" id="adminPass" placeholder="Kata Kunci">
                <button class="btn" onclick="loginAdmin()">Masuk</button>
                <button class="btn btn-secondary" onclick="closeAdmin()" style="background:transparent; color:#64748B; margin-top:10px; border:none;">Batal</button>
            </div>

            <div id="admin-dashboard-view" style="display:none;">
                <div class="stat-box">
                    <p style="font-size:0.8rem; color:#64748B;">TOTAL DATA TERSIMPAN</p>
                    <div class="stat-number" id="totalDataCount">0</div>
                </div>

                <button class="btn" onclick="refreshStats()" style="margin-bottom:10px;">Refresh Stats</button>
                <button class="btn btn-danger" onclick="confirmNuke()">HAPUS SEMUA DATA</button>
                <button class="btn" onclick="closeAdmin()" style="background:transparent; color:#64748B; margin-top:10px; border:1px solid var(--border);">Keluar</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Notifikasi</div>

    <script>
        // --- KONFIGURASI ADMIN ---
        const ADMIN_SECRET_KEY = "Williamafton"; // GANTI INI JIKA INGIN KATA KUNCI LAIN
        let clickCount = 0;
        let clickTimer;

        // --- LOGIKA ADMIN CLICK ---
        function checkAdminClick() {
            clickCount++;
            
            // Reset counter jika user berhenti klik selama 1 detik
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 1000);

            if (clickCount >= 5) {
                clickCount = 0;
                document.getElementById('admin-modal').style.display = 'flex';
                document.getElementById('admin-login-view').style.display = 'block';
                document.getElementById('admin-dashboard-view').style.display = 'none';
                document.getElementById('adminPass').value = '';
            }
        }

        function closeAdmin() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        async function loginAdmin() {
            const input = document.getElementById('adminPass').value;
            if (input === ADMIN_SECRET_KEY) {
                document.getElementById('admin-login-view').style.display = 'none';
                document.getElementById('admin-dashboard-view').style.display = 'block';
                await refreshStats();
            } else {
                showToast("Kata kunci salah!", true);
            }
        }

        async function refreshStats() {
            const count = await window.fbGetStats();
            document.getElementById('totalDataCount').textContent = count;
        }

        function confirmNuke() {
            if(confirm("PERINGATAN: Anda akan MENGHAPUS SEMUA DATA di Firebase.\n\nTindakan ini TIDAK BISA dibatalkan!\n\nLanjutkan?")) {
                performNuke();
            }
        }

        async function performNuke() {
            const btn = document.querySelector('.btn-danger');
            const originalText = btn.textContent;
            btn.textContent = "Menghapus...";
            btn.disabled = true;

            const result = await window.fbNukeAll();

            if(result.success) {
                showToast("Semua data berhasil dihapus!");
                await refreshStats();
            } else {
                showToast("Gagal menghapus: " + result.message, true);
            }

            btn.textContent = originalText;
            btn.disabled = false;
        }

        // --- LOGIKA USER (SAMA SEPERTI SEBELUMNYA) ---
        function generateShortId(length = 5) {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        async function handleSave() {
            const text = document.getElementById('inputText').value;
            const pass = document.getElementById('passInput').value;
            const days = parseInt(document.getElementById('expirySelect').value);
            const btn = document.getElementById('saveBtn');

            if(!text.trim()) return showToast("Teks kosong!", true);
            setLoading(btn, true);

            const result = await window.fbSaveData(text, pass, days);

            if(result.success) {
                document.getElementById('displayCode').textContent = result.code;
                document.getElementById('saveResult').style.display = 'block';
                showToast("Berhasil disimpan!");
            } else {
                showToast(result.message, true);
            }
            setLoading(btn, false);
        }

        async function handleLoad() {
            const code = document.getElementById('inputCode').value.trim();
            const pass = document.getElementById('openPass').value;
            const btn = document.getElementById('openBtn');

            if(!code) return showToast("Masukkan kode!", true);
            setLoading(btn, true);

            const result = await window.fbLoadData(code, pass);

            if(result.success) {
                document.getElementById('outputText').value = result.text;
                document.getElementById('openResult').style.display = 'block';
            } else {
                if(result.message.includes("password")) {
                    document.getElementById('openPassGroup').style.display = 'block';
                    document.getElementById('openPass').focus();
                }
                showToast(result.message, true);
            }
            setLoading(btn, false);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('#tab-save, #tab-open').forEach(d => d.style.display = 'none');
            document.getElementById('saveResult').style.display = 'none';
            document.getElementById('openResult').style.display = 'none';
            document.getElementById('openPassGroup').style.display = 'none';

            if(tab === 'save') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('tab-save').style.display = 'block';
            } else {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('tab-open').style.display = 'block';
            }
        }

        function copyCode() {
            const code = document.getElementById('displayCode').textContent;
            navigator.clipboard.writeText(code).then(() => showToast("Kode disalin!"));
        }

        function downloadOpenData() {
            const text = document.getElementById('outputText').value;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `firebase-data-${Date.now()}.txt`;
            a.click();
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast show ${isError ? 'error' : ''}`;
            setTimeout(() => toast.className = 'toast', 3000);
        }

        function setLoading(btn, isLoading) {
            if (isLoading) {
                btn.innerHTML = `<div class="loading-spinner"></div> Memproses...`;
                btn.disabled = true;
            } else {
                btn.innerHTML = btn.id === 'saveBtn' ? 'Generate Kode (Upload)' : 'Buka Data';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
