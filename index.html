<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextKeep PRO - Unlimited Length</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- LZString -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <!-- CryptoJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338ca;
            --bg: #F3F4F6;
            --card: #ffffff;
            --text: #1F2937;
            --border: #E5E7EB;
            --success: #10B981;
            --error: #EF4444;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px;
        }

        .container {
            width: 100%; max-width: 650px; background: var(--card); padding: 2rem;
            border-radius: var(--radius); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        h1 { color: var(--primary); display: flex; align-items: center; gap: 10px; margin-bottom: 0.5rem; }
        .subtitle { color: #6B7280; font-size: 0.9rem; margin-bottom: 1.5rem; }

        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
        
        textarea, input[type="text"], input[type="password"] {
            width: 100%; padding: 0.75rem; border: 2px solid var(--border);
            border-radius: 8px; font-family: monospace; font-size: 0.9rem; outline: none;
        }
        textarea { height: 150px; resize: vertical; font-family: inherit; font-size: 1rem;}
        textarea:focus, input:focus { border-color: var(--primary); }

        /* Tabs Switcher */
        .switcher { display: flex; background: #E0E7FF; padding: 4px; border-radius: 8px; margin-bottom: 1rem; }
        .switch-btn {
            flex: 1; border: none; background: transparent; padding: 8px; border-radius: 6px;
            cursor: pointer; font-weight: 600; font-size: 0.9rem; color: #4B5563; transition: 0.2s;
        }
        .switch-btn.active { background: white; color: var(--primary); shadow: 0 1px 2px rgba(0,0,0,0.1); }

        .btn { 
            padding: 0.75rem 1.2rem; border-radius: 8px; border: none; cursor: pointer; 
            font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; flex: 1; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: white; border: 2px solid var(--border); color: var(--text); }
        
        .result-box {
            display: none; margin-top: 1.5rem; background: #F9FAFB; border: 1px solid var(--border);
            padding: 1rem; border-radius: 8px; animation: fadeIn 0.3s;
        }
        .result-box h3 { font-size: 1rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; }
        
        /* Overlay Lock */
        #lock-overlay {
            display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.95);
            z-index: 100; align-items: center; justify-content: center;
        }
        .lock-card {
            background: white; padding: 2rem; border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center;
        }

        /* Warning Box */
        .warning-box {
            background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B;
            padding: 0.75rem; border-radius: 8px; font-size: 0.85rem; margin-top: 0.5rem;
            display: none; align-items: center; gap: 8px;
        }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/></svg>
            TextKeep PRO
        </h1>
        <p class="subtitle">Simpan teks panjang tanpa takut terpotong.</p>

        <!-- Mode Switcher -->
        <div class="switcher">
            <button class="switch-btn active" onclick="switchMode('create')">Mode Tulis</button>
            <button class="switch-btn" onclick="switchMode('open')">Mode Buka (Paste Kode)</button>
        </div>

        <!-- SECTION: CREATE (Tulis) -->
        <div id="section-create">
            <div class="form-group">
                <label>Isi Teks</label>
                <textarea id="textInput" placeholder="Paste teks panjang di sini..."></textarea>
                <div id="lengthWarning" class="warning-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
                    Teks terlalu panjang untuk Link. Gunakan menu "Kode Data" agar aman.
                </div>
            </div>
            
            <div class="form-group">
                <label>Password (Opsional)</label>
                <input type="password" id="passwordInput" placeholder="Kosongkan jika tidak diproteksi">
            </div>

            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" onclick="processData('url')">Buat Link</button>
                <button class="btn btn-secondary" onclick="processData('code')">Buat Kode Data</button>
            </div>
        </div>

        <!-- SECTION: OPEN (Buka) -->
        <div id="section-open" style="display: none;">
            <div class="form-group">
                <label>Tempel Kode Data / Link di sini</label>
                <textarea id="inputOpen" placeholder="Tempel string kode panjang atau link lengkap di sini..." style="height: 100px;"></textarea>
            </div>
            <div class="form-group" id="openPassGroup" style="display:none;">
                <label>Password Diperlukan</label>
                <input type="password" id="openPassword" placeholder="Masukkan password...">
            </div>
            <button class="btn btn-primary" onclick="openData()" style="width: 100%;">Buka Data</button>
        </div>

        <!-- RESULT AREA -->
        <div id="resultArea" class="result-box">
            <h3 id="resultTitle">Hasil:</h3>
            <textarea id="outputResult" readonly style="height: 80px; background: white; border-color: #D1D5DB;"></textarea>
            
            <div style="margin-top: 10px; display: flex; gap: 10px;">
                <button class="btn btn-secondary" onclick="copyOutput()" style="flex:1;">Salin</button>
                <button id="downloadBtn" class="btn btn-secondary" style="display:none;" onclick="downloadText()">Download .txt</button>
            </div>
        </div>

    </div>

    <!-- Lock Overlay (Hanya muncul jika hash URL terdeteksi saat load) -->
    <div id="lock-overlay">
        <div class="lock-card">
            <div style="color: var(--primary); margin-bottom: 1rem;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>
            <h2>Diproteksi Password</h2>
            <p style="color: #6B7280; margin-bottom: 1rem;">Masukkan password untuk membuka teks ini.</p>
            <input type="password" id="overlayPass" style="margin-bottom: 1rem;">
            <button class="btn btn-primary" style="width: 100%;" onclick="unlockOverlay()">Buka</button>
        </div>
    </div>

    <script>
        // --- VARIABEL ---
        const textInput = document.getElementById('textInput');
        const passwordInput = document.getElementById('passwordInput');
        const resultArea = document.getElementById('resultArea');
        const outputResult = document.getElementById('outputResult');
        const lengthWarning = document.getElementById('lengthWarning');
        
        // --- CEK PANJANG TEKS REALTIME ---
        textInput.addEventListener('input', () => {
            // Batas aman URL sekitar 2000 char (setelah kompresi)
            // Estimasi kasar: jika teks > 1500 char, potensi besar link akan panjang
            if (textInput.value.length > 1500) {
                lengthWarning.style.display = 'flex';
            } else {
                lengthWarning.style.display = 'none';
            }
        });

        // --- PROSES DATA (SAVE) ---
        function processData(type) {
            const text = textInput.value;
            const pass = passwordInput.value;

            if(!text.trim()) return alert("Teks kosong!");

            let payload = "";
            // Format Payload: "MODE:ENCRYPTED_DATA"
            // MODE 0 = No Pass, MODE 1 = Has Pass

            if (pass) {
                const enc = CryptoJS.AES.encrypt(text, pass).toString();
                payload = "1:" + enc;
            } else {
                payload = "0:" + text;
            }

            // Kompresi payload
            const compressed = LZString.compressToEncodedURIComponent(payload);
            let result = "";

            if (type === 'url') {
                // Cek batas URL browser (2.000 char biasanya aman untuk share link biasa)
                // Tapi kita pakai 2000 sebagai batas peringatan keras
                const fullUrl = window.location.href.split('#')[0] + "#" + compressed;
                
                if (fullUrl.length > 2000) {
                    alert("PERINGATAN: Teks terlalu panjang untuk dijadikan Link.\n\nLink akan terpotong dan gagal dibuka.\n\nGunakan tombol 'Buat Kode Data' sebagai gantinya.");
                    return;
                }
                result = fullUrl;
                document.getElementById('resultTitle').textContent = "Link Pendek:";
                document.getElementById('downloadBtn').style.display = 'none';
            } else {
                // Mode Kode Data (Unlimited)
                result = compressed;
                document.getElementById('resultTitle').textContent = "Kode Data (Salin ini):";
                document.getElementById('downloadBtn').style.display = 'none';
            }

            outputResult.value = result;
            resultArea.style.display = 'block';
        }

        // --- BUKA DATA (OPEN) ---
        function openData() {
            const inputStr = document.getElementById('inputOpen').value.trim();
            const pass = document.getElementById('openPassword').value;

            if(!inputStr) return alert("Input kosong!");

            // Cek apakah input berupa URL lengkap atau kode mentah
            let hash = "";
            if (inputStr.includes('#')) {
                hash = inputStr.split('#')[1];
            } else {
                hash = inputStr;
            }

            try {
                const decompressed = LZString.decompressFromEncodedURIComponent(hash);
                if(!decompressed) throw new Error("Data rusak atau kode salah.");

                const parts = decompressed.split(':');
                const mode = parts[0];
                const content = parts.slice(1).join(':');

                let finalText = "";

                if (mode === '1') {
                    // Butuh Password
                    if(!pass) {
                        document.getElementById('openPassGroup').style.display = 'block';
                        document.getElementById('openPassword').focus();
                        alert("Data ini diproteksi password. Silakan isi password.");
                        return;
                    }
                    const bytes = CryptoJS.AES.decrypt(content, pass);
                    const originalText = bytes.toString(CryptoJS.enc.Utf8);
                    
                    if(originalText) {
                        finalText = originalText;
                        showOpenResult(finalText);
                    } else {
                        alert("Password SALAH!");
                    }
                } else {
                    finalText = content;
                    showOpenResult(finalText);
                }

            } catch (e) {
                alert("Gagal membuka data. Pastikan kode yang ditempel benar.");
            }
        }

        function showOpenResult(text) {
            outputResult.value = text;
            document.getElementById('resultTitle').textContent = "Isi Teks:";
            document.getElementById('downloadBtn').style.display = 'inline-flex';
            resultArea.style.display = 'block';
            // Scroll ke hasil
            resultArea.scrollIntoView({ behavior: 'smooth' });
        }

        // --- UTILS ---
        function copyOutput() {
            outputResult.select();
            document.execCommand('copy');
            alert("Berhasil disalin!");
        }

        function downloadText() {
            const text = outputResult.value;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `textkeep-${Date.now()}.txt`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        // --- TAB SWITCHING ---
        function switchMode(mode) {
            document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('#section-create, #section-open').forEach(d => d.style.display = 'none');
            resultArea.style.display = 'none';

            if(mode === 'create') {
                document.querySelector('.switch-btn:nth-child(1)').classList.add('active');
                document.getElementById('section-create').style.display = 'block';
            } else {
                document.querySelector('.switch-btn:nth-child(2)').classList.add('active');
                document.getElementById('section-open').style.display = 'block';
            }
        }

        // --- INIT CHECK URL (Otomatis buka jika ada hash di URL saat load) ---
        window.addEventListener('load', () => {
            if(window.location.hash) {
                const hash = window.location.hash.substring(1);
                try {
                    // Cek cepat validitas data
                    const decompressed = LZString.decompressFromEncodedURIComponent(hash);
                    if(decompressed) {
                        const mode = decompressed.split(':')[0];
                        if(mode === '1') {
                            // Tampilkan overlay lock
                            document.getElementById('lock-overlay').style.display = 'flex';
                        } else {
                            // Langsung buka di mode view
                            switchMode('open');
                            document.getElementById('inputOpen').value = window.location.href;
                            openData();
                        }
                    }
                } catch(e) {}
            }
        });

        function unlockOverlay() {
            const pass = document.getElementById('overlayPass').value;
            const hash = window.location.hash.substring(1);
            
            try {
                const decompressed = LZString.decompressFromEncodedURIComponent(hash);
                const parts = decompressed.split(':');
                const mode = parts[0];
                const content = parts.slice(1).join(':');

                if(mode === '1') {
                    const bytes = CryptoJS.AES.decrypt(content, pass);
                    const originalText = bytes.toString(CryptoJS.enc.Utf8);

                    if(originalText) {
                        document.getElementById('lock-overlay').style.display = 'none';
                        switchMode('open');
                        document.getElementById('inputOpen').value = window.location.href;
                        // Isi password di form open
                        document.getElementById('openPassword').value = pass;
                        openData(); // Trigger open
                    } else {
                        alert("Password Salah!");
                    }
                }
            } catch(e) {
                alert("Error!");
            }
        }

    </script>
</body>
</html>
